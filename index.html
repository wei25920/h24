<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>24点计算器 - 经典算术挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Poppins', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* 主卡片 */
        .card {
            max-width: 680px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            border-radius: 3rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.15);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .card-inner {
            background: rgba(22, 32, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 1.8rem 2rem 2.2rem;
            border-radius: 3rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #F9E0A0, #F4C542);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 0.3rem;
        }

        .sub {
            text-align: center;
            color: #b9d0e7;
            font-weight: 500;
            font-size: 0.85rem;
            border-bottom: 1px dashed rgba(255,215,150,0.4);
            display: inline-block;
            width: auto;
            margin: 0 auto 1.5rem;
            padding-bottom: 0.5rem;
        }

        /* 数字输入区 */
        .numbers-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .input-group {
            flex: 1;
            min-width: 70px;
            background: #1e2e3b;
            border-radius: 2rem;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }

        .input-group:focus-within {
            transform: scale(1.02);
            box-shadow: 0 0 0 2px #F4C542, inset 0 1px 3px #00000030;
        }

        .num-input {
            width: 100%;
            background: #fef9e8;
            border: none;
            padding: 1rem 0.5rem;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            border-radius: 2rem;
            color: #1e2f3c;
            outline: none;
            transition: all 0.2s;
            font-feature-settings: "tnum";
            letter-spacing: 1px;
        }

        .num-input::placeholder {
            color: #9aaebf;
            font-size: 1rem;
            font-weight: normal;
        }

        /* 按钮区 */
        .button-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            border: none;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 3rem;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            background: #2c3e44;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(100deg, #F4B942, #E09D32);
            color: #1f2c33;
            font-weight: 700;
            box-shadow: 0 6px 0 #8B5E1F;
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #8B5E1F;
        }

        .btn-secondary {
            background: #2c4b5c;
            border: 1px solid #5d7f8f;
        }

        .btn-secondary:hover {
            background: #3d6070;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: rgba(255,255,210,0.1);
            backdrop-filter: blur(4px);
            border: 1px solid #F4C542;
            color: #F9E0A0;
        }

        .btn-outline:hover {
            background: #F4C54230;
        }

        /* 结果区域 */
        .result-area {
            background: #07131c8c;
            border-radius: 2rem;
            padding: 1.2rem 1.5rem;
            margin-top: 0.5rem;
            border: 1px solid rgba(244, 197, 66, 0.3);
            backdrop-filter: blur(4px);
        }

        .status {
            font-size: 1rem;
            font-weight: 600;
            color: #f5e7d3;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #F4C542;
            padding-left: 12px;
        }

        .solution-list {
            max-height: 340px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .solution-item {
            background: #0f212e75;
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 2rem;
            font-family: 'Courier New', 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 500;
            color: #f7e6c4;
            word-break: break-word;
            transition: 0.1s;
            border-left: 3px solid #F4C542;
            letter-spacing: 0.3px;
        }

        .solution-item strong {
            color: #FFD966;
            font-weight: 700;
        }

        .badge {
            background: #F4C54230;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #F4C542;
            display: inline-block;
        }

        .no-solution {
            color: #ffbb99;
            font-style: italic;
            padding: 1rem;
            text-align: center;
            background: #2c1e1e40;
            border-radius: 2rem;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 1.8rem;
            color: #7799b0;
        }

        /* 自定义滚动条 */
        .solution-list::-webkit-scrollbar {
            width: 5px;
        }
        .solution-list::-webkit-scrollbar-track {
            background: #1e2e3a;
            border-radius: 10px;
        }
        .solution-list::-webkit-scrollbar-thumb {
            background: #F4C542;
            border-radius: 10px;
        }

        @media (max-width: 520px) {
            .card-inner {
                padding: 1.2rem;
            }
            .num-input {
                font-size: 1.4rem;
                padding: 0.7rem 0.2rem;
            }
            .solution-item {
                font-size: 0.95rem;
            }
            .btn {
                padding: 0.6rem 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-inner">
        <h1>🃟 24点 · 智趣解法</h1>
        <div style="text-align: center;">
            <span class="sub">用加减乘除和括号，每个数用一次 → 24</span>
        </div>

        <!-- 数字输入区域 -->
        <div class="numbers-panel">
            <div class="input-group"><input type="number" id="num1" class="num-input" value="3" step="1" min="1" max="13" placeholder="A"></div>
            <div class="input-group"><input type="number" id="num2" class="num-input" value="3" step="1" min="1" max="13" placeholder="B"></div>
            <div class="input-group"><input type="number" id="num3" class="num-input" value="8" step="1" min="1" max="13" placeholder="C"></div>
            <div class="input-group"><input type="number" id="num4" class="num-input" value="8" step="1" min="1" max="13" placeholder="D"></div>
        </div>

        <!-- 操作栏 -->
        <div class="button-bar">
            <button id="calcBtn" class="btn btn-primary">✨ 计算24点</button>
            <button id="randomBtn" class="btn btn-secondary">🎲 随机数字</button>
            <button id="resetBtn" class="btn btn-outline">🔄 经典示例</button>
        </div>

        <!-- 结果展示区 -->
        <div class="result-area">
            <div class="status">
                <span>📐 解法探索</span>
                <span id="solutionCount" class="badge">等待计算</span>
            </div>
            <div id="solutionContainer" class="solution-list">
                <div style="text-align:center; color:#b9cfec; padding: 1rem;">点击「计算24点」开始</div>
            </div>
        </div>
        <footer>✓ 支持整数1-13，自动枚举括号 & 运算符组合 | 精确浮点容差</footer>
    </div>
</div>

<script>
    (function(){
        // ---------- 工具函数 ----------
        // 运算执行 (安全除法)
        function applyOperator(a, b, op) {
            if (op === '+') return a + b;
            if (op === '-') return a - b;
            if (op === '*') return a * b;
            if (op === '/') {
                if (Math.abs(b) < 1e-9) return null;  // 除零无效
                return a / b;
            }
            return null;
        }

        // 将运算结果与24比较 (容差)
        const TARGET = 24;
        const EPS = 1e-8;
        function isEqual24(val) {
            if (val === null || typeof val !== 'number') return false;
            return Math.abs(val - TARGET) < EPS;
        }

        // 美化解法表达式: 将 * / 替换为 × ÷ 
        function prettyExpr(expr) {
            return expr.replace(/\*/g, '×').replace(/\//g, '÷');
        }

        // ---------- 五种括号结构 同时计算数值+生成表达式字符串 ----------
        // 每种结构接收 (a,b,c,d) 以及运算符三元组 [op1, op2, op3]
        // 返回 { value, expr } 若中途除零返回 null
        
        // 结构1: ((a op b) op c) op d
        function struct1(a,b,c,d, ops) {
            const [op1, op2, op3] = ops;
            const step1 = applyOperator(a, b, op1);
            if (step1 === null) return null;
            const step2 = applyOperator(step1, c, op2);
            if (step2 === null) return null;
            const finalVal = applyOperator(step2, d, op3);
            if (finalVal === null) return null;
            const expr = `((${a} ${op1} ${b}) ${op2} ${c}) ${op3} ${d}`;
            return { value: finalVal, expr };
        }
        
        // 结构2: (a op (b op c)) op d
        function struct2(a,b,c,d, ops) {
            const [op1, op2, op3] = ops;
            const inner = applyOperator(b, c, op2);
            if (inner === null) return null;
            const step1 = applyOperator(a, inner, op1);
            if (step1 === null) return null;
            const finalVal = applyOperator(step1, d, op3);
            if (finalVal === null) return null;
            const expr = `(${a} ${op1} (${b} ${op2} ${c})) ${op3} ${d}`;
            return { value: finalVal, expr };
        }
        
        // 结构3: (a op b) op (c op d)
        function struct3(a,b,c,d, ops) {
            const [op1, op2, op3] = ops;
            const left = applyOperator(a, b, op1);
            if (left === null) return null;
            const right = applyOperator(c, d, op2);
            if (right === null) return null;
            const finalVal = applyOperator(left, right, op3);
            if (finalVal === null) return null;
            const expr = `(${a} ${op1} ${b}) ${op3} (${c} ${op2} ${d})`;
            return { value: finalVal, expr };
        }
        
        // 结构4: a op ((b op c) op d)
        function struct4(a,b,c,d, ops) {
            const [op1, op2, op3] = ops;
            const inner1 = applyOperator(b, c, op2);
            if (inner1 === null) return null;
            const inner2 = applyOperator(inner1, d, op3);
            if (inner2 === null) return null;
            const finalVal = applyOperator(a, inner2, op1);
            if (finalVal === null) return null;
            const expr = `${a} ${op1} ((${b} ${op2} ${c}) ${op3} ${d})`;
            return { value: finalVal, expr };
        }
        
        // 结构5: a op (b op (c op d))
        function struct5(a,b,c,d, ops) {
            const [op1, op2, op3] = ops;
            const inner1 = applyOperator(c, d, op3);
            if (inner1 === null) return null;
            const inner2 = applyOperator(b, inner1, op2);
            if (inner2 === null) return null;
            const finalVal = applyOperator(a, inner2, op1);
            if (finalVal === null) return null;
            const expr = `${a} ${op1} (${b} ${op2} (${c} ${op3} ${d}))`;
            return { value: finalVal, expr };
        }
        
        // 所有括号结构列表 (方便迭代)
        const structures = [struct1, struct2, struct3, struct4, struct5];
        
        // 运算符集合 (用于枚举)
        const operators = ['+', '-', '*', '/'];
        
        // ---------- 生成全排列 (去重辅助，但不去重也OK，最后用Set过滤表达式) ----------
        function getAllPermutations(arr) {
            if (arr.length === 0) return [[]];
            const result = [];
            for (let i = 0; i < arr.length; i++) {
                const current = arr[i];
                const remaining = [...arr.slice(0, i), ...arr.slice(i+1)];
                const perms = getAllPermutations(remaining);
                for (const perm of perms) {
                    result.push([current, ...perm]);
                }
            }
            return result;
        }
        
        // 枚举所有可能的运算符组合 (4^3 = 64)
        function getAllOperatorCombos() {
            const combos = [];
            for (let i = 0; i < operators.length; i++) {
                for (let j = 0; j < operators.length; j++) {
                    for (let k = 0; k < operators.length; k++) {
                        combos.push([operators[i], operators[j], operators[k]]);
                    }
                }
            }
            return combos;
        }
        
        const allOpsCombos = getAllOperatorCombos();  // 64组
        
        // ---------- 核心求解器: 给定四个数字 (数组Number)，返回去重后的解法表达式列表 ----------
        function solve24(numbers) {
            // 过滤无效数字
            const validNums = numbers.filter(n => Number.isFinite(n) && !isNaN(n));
            if (validNums.length !== 4) return [];
            // 转为数字保留整数形式 (但浮点也可)
            const nums = validNums.map(v => Number(v));
            
            // 获取所有排列 (可能会有重复排列，但没关系最后Set去重)
            const permutations = getAllPermutations(nums);
            const solutionSet = new Set();  // 存储表达式字符串 (原始样式带*/ 再用pretty统一)
            
            // 遍历每一个排列
            for (const perm of permutations) {
                const [a, b, c, d] = perm;
                // 遍历每一个运算符组合
                for (const ops of allOpsCombos) {
                    // 对五种括号结构依次尝试
                    for (const struct of structures) {
                        const result = struct(a, b, c, d, ops);
                        if (result && isEqual24(result.value)) {
                            // 得到有效表达式 (原始带* /)
                            let rawExpr = result.expr;
                            // 可选: 处理一些可读性优化但保留原意，直接存入
                            solutionSet.add(rawExpr);
                        }
                    }
                }
            }
            
            // 转换为列表，并做美观替换（将 * / 转为 × ÷）
            const solutions = Array.from(solutionSet).map(expr => prettyExpr(expr));
            // 附加按长度简单排序 (短表达式更清爽)
            solutions.sort((x,y) => x.length - y.length);
            return solutions;
        }
        
        // ---------- UI交互逻辑 ----------
        const numInputs = [
            document.getElementById('num1'),
            document.getElementById('num2'),
            document.getElementById('num3'),
            document.getElementById('num4')
        ];
        const calcBtn = document.getElementById('calcBtn');
        const randomBtn = document.getElementById('randomBtn');
        const resetBtn = document.getElementById('resetBtn');
        const solutionContainer = document.getElementById('solutionContainer');
        const solutionCountSpan = document.getElementById('solutionCount');
        
        // 获取当前四个数字（整数）
        function getCurrentNumbers() {
            return numInputs.map(inp => {
                let val = parseFloat(inp.value);
                if (isNaN(val)) return NaN;
                // 限制范围保持在1-13之间但依旧允许用户有自由度，不过24点通常建议整数
                return Math.round(val);   // 取整，避免小数点误解
            });
        }
        
        // 设置数字
        function setNumbers(arr) {
            if (arr.length === 4) {
                arr.forEach((val, idx) => {
                    if (numInputs[idx]) numInputs[idx].value = val;
                });
            }
        }
        
        // 展示解法
        function renderSolutions(solutions) {
            if (!solutions.length) {
                solutionContainer.innerHTML = `<div class="no-solution">🧩 没有找到使结果等于24的表达式<br>试试其他数字组合吧~</div>`;
                solutionCountSpan.innerText = `无解`;
                return;
            }
            
            const count = solutions.length;
            solutionCountSpan.innerText = `${count} 种解法`;
            const html = solutions.map(expr => {
                // 突出等号效果
                return `<div class="solution-item">🎯 <strong>${expr}</strong> = 24</div>`;
            }).join('');
            solutionContainer.innerHTML = html;
        }
        
        // 主要计算流程
        function computeAndDisplay() {
            const nums = getCurrentNumbers();
            // 校验有效性
            let invalid = false;
            for (let i = 0; i < nums.length; i++) {
                if (isNaN(nums[i]) || !Number.isInteger(nums[i]) || nums[i] < 1) {
                    invalid = true;
                    break;
                }
            }
            if (invalid) {
                solutionContainer.innerHTML = `<div class="no-solution">⚠️ 请输入有效的正整数（建议1~13）</div>`;
                solutionCountSpan.innerText = `输入无效`;
                return;
            }
            
            // 调用求解器
            const solutions = solve24(nums);
            renderSolutions(solutions);
        }
        
        // 随机生成1-13整数 (包含)
        function randomInt() {
            return Math.floor(Math.random() * 13) + 1;
        }
        
        function generateRandomNumbers() {
            const randomNums = [randomInt(), randomInt(), randomInt(), randomInt()];
            setNumbers(randomNums);
            // 随机后自动计算
            computeAndDisplay();
        }
        
        // 重置为经典示例 (3,3,8,8) 经典24点解法: 8 / (3 - 8/3)
        function resetToClassic() {
            setNumbers([3, 3, 8, 8]);
            computeAndDisplay();
        }
        
        // 事件绑定 & 初始化, 自动计算默认示例
        function init() {
            calcBtn.addEventListener('click', computeAndDisplay);
            randomBtn.addEventListener('click', generateRandomNumbers);
            resetBtn.addEventListener('click', resetToClassic);
            
            // 输入框支持回车计算
            numInputs.forEach(inp => {
                inp.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') computeAndDisplay();
                });
            });
            
            // 初次加载执行自动计算经典示例
            computeAndDisplay();
        }
        
        init();
    })();
</script>
</body>
</html>
